name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: btm
          POSTGRES_PASSWORD: btm
          POSTGRES_DB: btm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U btm" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://btm:btm@localhost:5432/btm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit + integration tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test – db, demo data and dashboard
        run: |
          docker compose up -d db dashboard
          docker compose --profile demo run --rm seed
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker compose exec -T db psql -U btm -d btm -c \
            "SELECT count(*) FROM traffic.v_latest_vessels" | tee /dev/stderr | grep -E "^\s+[1-9]"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
