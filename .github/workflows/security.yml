name: Security scan

# Scans the Docker image and the repository with Trivy.
# - Results (HIGH + CRITICAL) are uploaded to the GitHub "Security" tab.
# - The build fails only on CRITICAL vulnerabilities that already have a fix,
#   i.e. issues we can actually do something about.
# - Runs weekly as well, because new CVEs are published even when the code
#   doesn't change.
#
# All third-party actions are pinned to full commit SHAs. Tags can be moved
# (trivy-action's tags were hijacked in March 2026, CVE-2026-33634), commits cannot.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    env:
      IMAGE: baltic-traffic-monitor:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --pull -t "$IMAGE" .

      - name: Trivy – report (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy – summary table
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          output: trivy-image.txt
          severity: HIGH,CRITICAL
          exit-code: "0"
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Trivy – container image (HIGH/CRITICAL)"
            echo '```'
            cat trivy-image.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy – gate on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true

  repository:
    name: Dependencies, secrets & config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # requirements.txt (Python packages), leaked secrets and Dockerfile/compose best practices
      - name: Trivy – filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-repo.sarif
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repository

      - name: Trivy – gate on secrets and fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true
